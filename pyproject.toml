[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youqu-ai"
version = "2.18.9"
authors = [
    { name = "re2zero", email = "yangwu@uniontech.com" },
]

description = "youqu"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: OS Independent",
]

dependencies = [
    "funnylog",
    "pydantic>=2.0",
    "pytest>=6.2.5",
    "allure-pytest==2.9.45",
    "allure-custom",
    "image-center",
    "pdocr-rpc",
    "PyAutoGUI==0.9.53",
    "pyscreeze==0.1.28",
    "pytest-rerunfailures==10.2",
    "pytest-timeout==2.1.0",
    "setuptools<81",
    "rich",
    "tomli; python_version < '3.11'",
    "fastmcp-slim[server]",
    "httpx",
]

[project.optional-dependencies]
webui = ["playwright"]
remote = ["zerorpc"]

[project.scripts]
youqu = "youqu.cli.main:main"
youqu-startproject = "youqu.src.startproject:cli"

[project.entry-points.pytest11]
youqu = "youqu.plugin"

[tool.hatch.build]
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel]
sources = {"" = "youqu"}
only-include = [
    "src",
    "setting",
    "cli",
    "plugin",
    "skills",
    "conftest.py",
    "__init__.py",
]

[project.urls]
Source = "https://github.com/linuxdeepin/youqu"
Documentation = "https://github.com/linuxdeepin/youqu"
