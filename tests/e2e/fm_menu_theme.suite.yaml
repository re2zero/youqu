name: "E2E: dde-file-manager 主菜单切换主题"
app: "dde-file-manager"

setup:
  - action: session_start
    command: "/usr/bin/dde-file-manager"
    wait: 2.0

teardown:
  - action: session_stop

suites:
  - id: fm_menu_theme_001
    name: "切换主题-跟随系统→浅色→深色"
    steps:
      - action: dtk_main_menu
        items: ["主题", "跟随系统"]
        wait: 0.5
      - action: dtk_main_menu
        items: ["主题", "浅色"]
        wait: 0.5
      - action: dtk_main_menu
        items: ["主题", "深色"]
        wait: 0.5
      - action: assert_window
        window: "DMainWindow"
