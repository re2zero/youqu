name: "E2E: 文件管理器主菜单切换主题-跟随系统→浅色→深色"
app: "dde-file-manager"
screenshot: false

setup:
  - action: session_start
    command: "/usr/bin/dde-file-manager"
    wait: 1.5

steps:
  - name: "切换主题为跟随系统"
    action: main_menu_comb
    items: ["主题", "跟随系统"]
    wait: 0.5

  - name: "切换主题为浅色"
    action: main_menu_comb
    items: ["主题", "浅色"]
    wait: 0.5

  - name: "切换主题为深色"
    action: main_menu_comb
    items: ["主题", "深色"]
    wait: 0.5

  - name: "验证文件管理器进程仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "dde-file-manager"

teardown:
  - action: session_stop
